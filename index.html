<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18263e;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #90b4ff;outline-offset:2px}body{margin:0} .app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e5eaf1;padding:26px 15px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:800;letter-spacing:-1px;padding:6px 14px;color:#234e9c}.brand span{color:#80a9f9}.nav{display:grid;gap:5px}.nav button{width:100%;text-align:left;background:transparent;border:0;padding:12px 15px;border-radius:10px;color:#596679;font-weight:550}.nav button:hover,.nav button.active{background:#eaf1ff;color:#2456ab}.sidefoot{margin-top:auto;padding:12px;font-size:12px;color:#8690a0;line-height:1.6}.main{max-width:1400px;width:100%;margin:auto;padding:35px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:29px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-1px}h2{font-size:17px;margin:0 0 16px}h3{font-size:14px;margin:0}.muted{color:#7f8b9f;font-size:13px;margin:5px 0}.btn{border:1px solid #e0e7f1;background:white;color:#344663;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:650}.btn:hover{background:#f2f6fe}.btn.primary{background:#3166c6;color:white;border-color:#3166c6}.btn.primary:hover{background:#2657af}.btn.danger{color:#b9424a}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr);gap:20px}.card{background:white;border:1px solid #e7ebf2;border-radius:15px;padding:22px;box-shadow:0 3px 15px #20396106}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.stat{background:white;border:1px solid #e7ebf2;border-radius:13px;padding:19px}.stat b{font-size:26px;display:block;margin-top:12px}.stat small{font-size:12px;color:#8290a1}.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #f0f2f6}.task:last-child{border-bottom:0}.task input[type=checkbox]{accent-color:#3166c6;width:17px;height:17px;margin-top:2px}.taskbody{flex:1;min-width:0}.taskname{font-size:14px;font-weight:600;overflow-wrap:anywhere}.done .taskname{text-decoration:line-through;color:#98a2b2}.meta{font-size:12px;color:#8994a4;margin-top:5px}.tag{display:inline-block;border-radius:6px;padding:3px 6px;background:#eff4fb;color:#5c7196;font-size:11px;margin-right:4px}.tag.high{background:#fff0ef;color:#bb5754}.tag.medium{background:#fff6e7;color:#ac7827}.tag.low{background:#e9f8ef;color:#438761}.plain{border:0;background:transparent;color:#7b8a9c;padding:3px 7px}.plain:hover{color:#2456ab}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid #dfe5ee;border-radius:9px;background:#fff;color:#24324a;padding:10px;width:100%}.toolbar input{width:210px}.toolbar select{width:auto}.form{display:grid;gap:13px}.form label{font-size:12px;font-weight:650;color:#65758b;display:grid;gap:5px}.form textarea{min-height:95px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calendarbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #edf0f6;border-left:1px solid #edf0f6}.weekday{text-align:center;padding:12px 2px;color:#8794a5;font-weight:650;font-size:12px}.day{min-height:105px;background:white;border:0;border-right:1px solid #edf0f6;border-bottom:1px solid #edf0f6;text-align:left;padding:9px;min-width:0;color:#35445c}.day:hover{background:#f5f8ff}.day.other{background:#fafbfc;color:#b0b8c5}.day.today .num{background:#3166c6;color:white}.num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;font-size:12px;font-weight:700}.dayitems{display:grid;gap:3px;margin-top:5px}.eventpill{font-size:10px;border-radius:4px;padding:4px;background:#eaf0fe;color:#2456ab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eventpill.event{background:#eaf8f1;color:#267d59}.columns{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow-x:auto}.weekcol{background:#f7f9fc;border:1px solid #e9edf4;border-radius:10px;padding:12px;min-height:205px}.weekcol h3{margin-bottom:12px}.weekitem{background:white;border:1px solid #e6eafa;padding:9px;border-radius:8px;font-size:12px;margin-bottom:8px}.projectgrid,.notegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.project,.note{border:1px solid #e8ecf2;border-radius:12px;background:white;padding:20px}.progress{height:8px;background:#eaf0f7;border-radius:10px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#4a7dd3;border-radius:10px}.empty{color:#91a0b1;font-size:13px;padding:20px 0}.modalback{position:fixed;inset:0;background:#101b32a8;z-index:10;display:grid;place-items:center;padding:15px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:25px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.small{font-size:12px}.notice{padding:13px;border-radius:10px;background:#f0f5fe;color:#4b6591;font-size:13px;line-height:1.5}.mobilebar{display:none}.hidden{display:none!important}body.dark{background:#101827;color:#edf2ff}body.dark .sidebar,body.dark .card,body.dark .stat,body.dark .project,body.dark .note,body.dark .modal,body.dark .day,body.dark .weekitem{background:#1a2638;color:#edf2ff;border-color:#344158}body.dark .nav button,body.dark .muted{color:#adbbcd}body.dark .nav button.active{background:#293e64;color:#dbe8ff}body.dark .btn,body.dark input,body.dark textarea,body.dark select{background:#23334a;color:#e3ebfa;border-color:#3a4b64}body.dark .day.other,body.dark .weekcol{background:#172234;color:#a1afc4}body.dark .task{border-color:#344158}body.dark .brand{color:#9bbdff}@media(max-width:850px){.app{display:block}.sidebar{position:static;height:auto;padding:12px;gap:8px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;width:auto;padding:10px}.sidefoot{display:none}.brand{padding:4px}.main{padding:20px 15px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.day{min-height:72px;padding:4px}.dayitems .eventpill:nth-child(n+2){display:none}.calendar.card{padding:10px}.weekday{font-size:10px}.eventpill{font-size:9px}.formrow{grid-template-columns:1fr}}@media(max-width:450px){.stats{gap:6px}.stat{padding:10px}.stat b{font-size:21px}.stat small{font-size:10px}.top h1{font-size:25px}.day{min-height:59px}.dayitems{margin-top:1px}.eventpill{padding:2px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">daymark<span>.</span></div><nav class="nav" id="nav"></nav><div class="sidefoot">Your personal planning space.<br>Data stays in this browser.<br><button class="btn" id="themeToggle" style="margin-top:12px">☾ Toggle theme</button></div></aside><main class="main" id="main"></main></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';
const KEY='daymark-v1';const initial={tasks:[],events:[],projects:[],notes:[],dark:false};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}};for(const k of ['tasks','events','projects','notes'])if(!Array.isArray(state[k]))state[k]=[];let view='Dashboard',calDate=new Date(),calMode='Month',search='',filter='All';const sections=['Dashboard','Calendar','Tasks','Projects','Weekly Planner','Notes','Settings'];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const today=()=>day(new Date());const dateObj=s=>new Date(s+'T12:00:00');const fmt=s=>s?dateObj(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'No date';const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Could not save. Your browser may be out of storage. Export your data from Settings.')}}const byDate=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');const getProjects=()=>state.projects;function btn(t,action,cls=''){return '<button class="btn '+cls+'" data-action="'+esc(action)+'">'+esc(t)+'</button>'}function taskHTML(t){const p=state.projects.find(p=>p.id===t.project);return '<div class="task '+(t.done?'done':'')+'"><input aria-label="Complete '+esc(t.title)+'" type="checkbox" data-check="'+esc(t.id)+'" '+(t.done?'checked':'')+'><div class="taskbody"><div class="taskname">'+esc(t.title)+'</div><div class="meta">'+(t.due?fmt(t.due)+(t.time?' · '+esc(t.time):''):'Anytime')+' · <span class="tag '+esc(t.priority.toLowerCase())+'">'+esc(t.priority)+'</span>'+(p?' · '+esc(p.name):'')+'</div></div><button class="plain" aria-label="Edit task" data-edit-task="'+esc(t.id)+'">✎</button><button class="plain" aria-label="Delete task" data-delete-task="'+esc(t.id)+'">×</button></div>'}function tasksHTML(arr){return arr.length?arr.map(taskHTML).join(''):'<div class="empty">Nothing here yet. Add a task to get started.</div>'}function page(title,subtitle,action){return '<header class="top"><div><h1>'+esc(title)+'</h1><p class="muted">'+esc(subtitle)+'</p></div>'+(action||'')+'</header>'}function dashboard(){const active=state.tasks.filter(t=>!t.done),tod=active.filter(t=>t.due===today()).sort(byDate),over=active.filter(t=>t.due&&t.due<today()),weekend=new Date();weekend.setDate(weekend.getDate()+7);const upcoming=active.filter(t=>t.due&&t.due>=today()&&t.due<=day(weekend)).sort(byDate);const all=state.tasks.length,done=state.tasks.filter(t=>t.done).length;return page('Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+'!','Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}),btn('+ New task','task','primary'))+'<section class="stats"><div class="stat"><small>Due today</small><b>'+tod.length+'</b></div><div class="stat"><small>Overdue</small><b>'+over.length+'</b></div><div class="stat"><small>Completed tasks</small><b>'+done+'</b></div></section><section class="grid"><div class="card"><h2>Today’s priorities</h2>'+tasksHTML(tod)+'</div><div class="card"><h2>Coming up this week</h2>'+tasksHTML(upcoming.slice(0,7))+'</div><div class="card"><h2>Task progress</h2><div class="muted">'+done+' of '+all+' completed</div><div class="progress"><i style="width:'+(all?Math.round(done/all*100):0)+'%"></i></div><div class="notice">Tip: assign due dates to tasks so they appear in your calendar and daily agenda.</div></div><div class="card"><h2>Overdue tasks</h2>'+tasksHTML(over.slice(0,5))+'</div></section>'}function tasks(){let arr=[...state.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||byDate(a,b));if(search)arr=arr.filter(t=>[t.title,t.description,t.category].join(' ').toLowerCase().includes(search.toLowerCase()));if(filter==='Active')arr=arr.filter(t=>!t.done);else if(filter==='Completed')arr=arr.filter(t=>t.done);else if(filter==='Overdue')arr=arr.filter(t=>!t.done&&t.due&&t.due<today());return page('Tasks','Capture, prioritize, and complete your to-dos.',btn('+ New task','task','primary'))+'<section class="card"><div class="toolbar"><input id="search" placeholder="Search tasks..." aria-label="Search tasks" value="'+esc(search)+'"><select id="filter"><option '+(filter==='All'?'selected':'')+'>All</option><option '+(filter==='Active'?'selected':'')+'>Active</option><option '+(filter==='Completed'?'selected':'')+'>Completed</option><option '+(filter==='Overdue'?'selected':'')+'>Overdue</option></select></div><div id="taskResults">'+tasksHTML(arr)+'</div></section>'}function calendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());const period=calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});let out='';if(calMode==='Month'){out='<div class="calgrid">';for(let i=0;i<7;i++)out+='<div class="weekday">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]+'</div>';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=day(d);let tasks=state.tasks.filter(t=>t.due===ds),ev=state.events.filter(e=>e.date===ds);out+='<button class="day '+(d.getMonth()!==m?'other ':'')+(ds===today()?'today':'')+'" data-day="'+ds+'"><span class="num">'+d.getDate()+'</span><span class="dayitems">'+[...ev.map(e=>'<span class="eventpill event">'+esc(e.title)+'</span>'),...tasks.map(t=>'<span class="eventpill">'+esc(t.title)+'</span>')].slice(0,3).join('')+'</span></button>'}out+='</div>'}else{const count=calMode==='Day'?1:7;let startday=new Date(calDate);if(count===7)startday.setDate(startday.getDate()-startday.getDay());out='<div class="columns" style="grid-template-columns:repeat('+count+',minmax('+(count===1?'200':'120')+'px,1fr))">';for(let i=0;i<count;i++){let d=new Date(startday);d.setDate(d.getDate()+i);const ds=day(d);out+='<div class="weekcol"><h3>'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</h3>'+state.events.filter(e=>e.date===ds).map(e=>'<div class="weekitem">📅 '+esc(e.time||'')+' '+esc(e.title)+' <button class="plain" data-edit-event="'+esc(e.id)+'">✎</button></div>').join('')+state.tasks.filter(t=>t.due===ds).map(t=>'<div class="weekitem">'+(t.done?'✓ ':'□ ')+esc(t.title)+' <button class="plain" data-edit-task="'+esc(t.id)+'">✎</button></div>').join('')+'<button class="btn small" data-event-day="'+ds+'">+ Event</button></div>'}out+='</div>'}return page('Calendar','Your schedule, deadlines, and events.',btn('+ Add event','event','primary'))+'<div class="card calendar"><div class="calendarbar"><div><button class="btn" data-action="prev">‹</button> <button class="btn" data-action="next">›</button> <button class="btn" data-action="today">Today</button> <strong style="margin-left:12px">'+esc(period)+'</strong></div><div class="toolbar" style="margin:0"><select id="calMode">'+['Month','Week','Day'].map(v=>'<option '+(calMode===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div>'+out+'</div><p class="muted">Select a date to add an event. Tasks with due dates appear automatically.</p>'}function projects(){return page('Projects','Keep your bigger goals organized.',btn('+ New project','project','primary'))+'<div class="projectgrid">'+(state.projects.length?state.projects.map(p=>{const arr=state.tasks.filter(t=>t.project===p.id),done=arr.filter(t=>t.done).length;return '<div class="project"><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.description||'No description')+'</p><div class="muted">'+done+' of '+arr.length+' tasks finished</div><div class="progress"><i style="width:'+(arr.length?done/arr.length*100:0)+'%"></i></div>'+btn('Edit','editProject:'+p.id)+ ' '+btn('Delete','deleteProject:'+p.id,'danger')+'</div>'}).join(''):'<div class="empty">No projects yet. Create one to group related tasks.</div>')+'</div>'}function week(){let start=new Date();start.setDate(start.getDate()-start.getDay());let out='<div class="columns">';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=day(d);out+='<div class="weekcol"><h3>'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</h3>'+state.tasks.filter(t=>t.due===ds).map(t=>'<div class="weekitem">'+(t.done?'✓ ':'□ ')+esc(t.title)+'</div>').join('')+'<button class="btn small" data-task-day="'+ds+'">+ Task</button></div>'}return page('Weekly Planner','Plan out your week one day at a time.',btn('+ New task','task','primary'))+'<section class="card">'+out+'</div></section>'}function notes(){return page('Notes','Keep ideas, reminders, and reference material.',btn('+ New note','note','primary'))+'<div class="notegrid">'+(state.notes.length?state.notes.map(n=>'<div class="note"><h2>'+esc(n.title)+'</h2><p class="muted" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(n.body.slice(0,180))+'</p>'+btn('Edit','editNote:'+n.id)+' '+btn('Delete','deleteNote:'+n.id,'danger')+'</div>').join(''):'<div class="empty">No notes yet.</div>')+'</div>'}function settings(){return page('Settings','Manage your planner and your data.')+'<section class="card" style="max-width:680px"><h2>Privacy and storage</h2><p class="muted">Your tasks, notes, projects, and events are stored only in this browser using localStorage. They do not sync across devices or browsers, and clearing browser data can delete them.</p><div class="toolbar" style="margin-top:20px">'+btn('Export backup','export')+btn('Import backup','import')+btn('Toggle dark mode','theme')+'</div><div class="notice">Export a backup regularly. Importing a backup replaces the data currently stored here.</div></section>'}function render(){document.body.classList.toggle('dark',!!state.dark);$('#nav').innerHTML=sections.map(s=>'<button data-view="'+esc(s)+'" class="'+(view===s?'active':'')+'">'+({Dashboard:'▦ ',Calendar:'▦ ',Tasks:'☑ ',Projects:'▣ ','Weekly Planner':'☷ ',Notes:'▤ ',Settings:'⚙ '}[s])+esc(s)+'</button>').join('');$('#main').innerHTML=({Dashboard:dashboard,Calendar:calendar,Tasks:tasks,Projects:projects,'Weekly Planner':week,Notes:notes,Settings:settings}[view])()}function close(){ $('#modalRoot').innerHTML='' }function modal(title,fields,onSave,onDelete){$('#modalRoot').innerHTML='<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modalhead"><h2 style="margin:0">'+esc(title)+'</h2><button class="plain" aria-label="Close dialog" id="close">✕</button></div><form class="form" id="editForm">'+fields+'<div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div></div>';$('#close').onclick=$('#cancel').onclick=close;$('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))close()});$('#editForm').addEventListener('submit',e=>{e.preventDefault();onSave(new FormData(e.target));save();close();render()});$('#editForm input')?.focus()}const field=(name,label,value='',type='text',required=false)=>'<label>'+esc(label)+'<input name="'+esc(name)+'" type="'+esc(type)+'" value="'+esc(value)+'" '+(required?'required':'')+'></label>';function editTask(t={},date=''){let projects='<option value="">None</option>'+getProjects().map(p=>'<option value="'+esc(p.id)+'" '+(t.project===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('');modal(t.id?'Edit task':'New task',field('title','Task title',t.title,'text',true)+'<label>Description<textarea name="description">'+esc(t.description)+'</textarea></label><div class="formrow">'+field('due','Due date',t.due||date,'date')+field('time','Time (optional)',t.time,'time')+'</div><div class="formrow"><label>Priority<select name="priority">'+['Low','Medium','High'].map(x=>'<option '+((t.priority||'Medium')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Category<select name="category">'+['Personal','Academics','Work','Fitness','Other'].map(x=>'<option '+((t.category||'Personal')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><label>Project<select name="project">'+projects+'</select></label>',fd=>{let values=Object.fromEntries(fd);if(t.id)Object.assign(t,values);else state.tasks.push({id:id(),done:false,...values})})}function editEvent(e={},date=''){modal(e.id?'Edit event':'New event',field('title','Event title',e.title,'text',true)+'<div class="formrow">'+field('date','Date',e.date||date||today(),'date',true)+field('time','Start time',e.time,'time')+'</div><label>Description<textarea name="description">'+esc(e.description)+'</textarea></label>',fd=>{let values=Object.fromEntries(fd);if(e.id)Object.assign(e,values);else state.events.push({id:id(),...values})})}function editProject(p={}){modal(p.id?'Edit project':'New project',field('name','Project name',p.name,'text',true)+'<label>Description<textarea name="description">'+esc(p.description)+'</textarea></label>',fd=>{let v=Object.fromEntries(fd);if(p.id)Object.assign(p,v);else state.projects.push({id:id(),...v})})}function editNote(n={}){modal(n.id?'Edit note':'New note',field('title','Title',n.title,'text',true)+'<label>Note<textarea name="body" style="min-height:170px">'+esc(n.body)+'</textarea></label>',fd=>{let v=Object.fromEntries(fd);if(n.id)Object.assign(n,v);else state.notes.push({id:id(),...v})})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.check)return;if(b.dataset.editTask){editTask(state.tasks.find(t=>t.id===b.dataset.editTask));return}if(b.dataset.deleteTask){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.deleteTask);save();render()}return}if(b.dataset.editEvent){editEvent(state.events.find(t=>t.id===b.dataset.editEvent));return}if(b.dataset.day){editEvent({},b.dataset.day);return}if(b.dataset.eventDay){editEvent({},b.dataset.eventDay);return}if(b.dataset.taskDay){editTask({},b.dataset.taskDay);return}let a=b.dataset.action;if(!a)return;let [type,key]=a.split(':');if(type==='task')editTask();if(type==='event')editEvent();if(type==='project')editProject();if(type==='note')editNote();if(type==='editProject')editProject(state.projects.find(p=>p.id===key));if(type==='editNote')editNote(state.notes.find(n=>n.id===key));if(type==='deleteProject'&&confirm('Delete project? Its tasks will remain ungrouped.')){state.projects=state.projects.filter(p=>p.id!==key);state.tasks.forEach(t=>{if(t.project===key)t.project=''});save();render()}if(type==='deleteNote'&&confirm('Delete note?')){state.notes=state.notes.filter(n=>n.id!==key);save();render()}if(type==='prev'||type==='next'){const delta=type==='next'?1:-1;calDate=new Date(calDate);if(calMode==='Month')calDate.setMonth(calDate.getMonth()+delta);else calDate.setDate(calDate.getDate()+delta*(calMode==='Week'?7:1));render()}if(type==='today'){calDate=new Date();render()}if(type==='theme'){state.dark=!state.dark;save();render()}if(type==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='daymark-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(type==='import'){$('#importFile').click()}});
document.addEventListener('change',e=>{if(e.target.dataset.check){let t=state.tasks.find(t=>t.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();render()}}if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='calMode'){calMode=e.target.value;render()}if(e.target.id==='importFile'){let file=e.target.files[0];if(!file)return;file.text().then(raw=>{let data=JSON.parse(raw);if(!['tasks','events','projects','notes'].every(k=>Array.isArray(data[k])))throw Error('Invalid backup');if(confirm('Replace all planner data with this backup?')){state={...initial,...data};save();render()}}).catch(()=>alert('Could not import this file. Please select a valid Daymark backup.'))}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const cursor=e.target.selectionStart;const arr=[...state.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||byDate(a,b)).filter(t=>(!search||[t.title,t.description,t.category].join(' ').toLowerCase().includes(search.toLowerCase()))&&(filter==='All'||filter==='Active'&&!t.done||filter==='Completed'&&t.done||filter==='Overdue'&&!t.done&&t.due&&t.due<today()));$('#taskResults').innerHTML=tasksHTML(arr);e.target.setSelectionRange(cursor,cursor)}});
$('#themeToggle').onclick=()=>{state.dark=!state.dark;save();render()};const inp=document.createElement('input');inp.type='file';inp.accept='application/json';inp.id='importFile';inp.className='hidden';document.body.appendChild(inp);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
})();
